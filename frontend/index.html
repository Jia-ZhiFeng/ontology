<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OntoStudio · 本体建模平台</title>
<style>
:root{
  --bg:#070B14; --panel:rgba(15,23,42,.72);
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.3);
  --txt:#E6EDF7; --txt2:#94A3B8; --txt3:#5B6577;
  --cyan:#22D3EE; --blue:#3B82F6; --purple:#818CF8; --green:#34D399; --amber:#F5A623; --pink:#F472B6; --red:#F87171;
  --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(ellipse 60% 50% at 70% -10%, rgba(34,211,238,.07), transparent 60%),
  radial-gradient(ellipse 50% 60% at 10% 110%, rgba(99,102,241,.06), transparent 60%),
  linear-gradient(rgba(148,163,184,.035) 1px, transparent 1px),
  linear-gradient(90deg, rgba(148,163,184,.035) 1px, transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px}
#app{display:flex;height:100vh;position:relative;z-index:1}

#sidebar{width:216px;flex:none;background:rgba(10,15,28,.85);border-right:1px solid var(--line);backdrop-filter:blur(12px);display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0891B2,#3B82F6);display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(34,211,238,.35)}
.logo-mark svg{width:19px;height:19px}
.logo h1{font-size:15px;font-weight:600;letter-spacing:.5px}
.logo small{display:block;font-size:10.5px;color:var(--txt3);font-weight:400;letter-spacing:1.5px}
.nav{flex:1;padding:4px 10px;overflow:auto}
.nav-label{font-size:11px;color:var(--txt3);padding:12px 10px 5px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8.5px 12px;border-radius:9px;color:var(--txt2);cursor:pointer;margin-bottom:2px;transition:.18s;position:relative;font-size:13.5px}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-item:hover{color:var(--txt);background:rgba(148,163,184,.07)}
.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(59,130,246,.1));box-shadow:inset 0 0 0 1px rgba(34,211,238,.25)}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:20%;height:60%;width:3px;border-radius:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.nav-item.disabled{opacity:.38;cursor:not-allowed}
.side-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--txt3)}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);margin-right:7px}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(10,15,28,.6);backdrop-filter:blur(12px)}
.crumb{font-size:13px;color:var(--txt3)}
.crumb b{color:var(--txt);font-weight:600}
.crumb i{font-style:normal;margin:0 8px;opacity:.5}
#topbar .sp{flex:1}
.ontology-sel{background:rgba(148,163,184,.08);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--txt2);font-size:12.5px;outline:none}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#22D3EE);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}

#pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow:hidden;display:none}
.page.active{display:flex;flex-direction:column}
#page-graph.active{flex-direction:row}
.pad{padding:22px;overflow:auto;flex:1;min-height:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:8px;border:1px solid var(--line2);background:rgba(148,163,184,.06);color:var(--txt);font-size:13px;cursor:pointer;transition:.18s;font-family:inherit}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-primary{background:linear-gradient(135deg,#0891B2,#2563EB);border:none;color:#fff;box-shadow:0 4px 16px rgba(34,211,238,.25)}
.btn-primary:hover{color:#fff;filter:brightness(1.12)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-danger:hover{border-color:var(--red);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;border:1px solid var(--line2);color:var(--txt2)}
.chip.c-on{border-color:rgba(34,211,238,.5);color:var(--cyan);background:rgba(34,211,238,.08)}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px}
.tag.ok{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.tag.warn{background:rgba(245,166,35,.12);color:var(--amber);border:1px solid rgba(245,166,35,.3)}
.tag.info{background:rgba(59,130,246,.12);color:#7EB1FF;border:1px solid rgba(59,130,246,.3)}
.tag.off{background:rgba(148,163,184,.1);color:var(--txt3);border:1px solid var(--line)}
code{font-family:var(--mono);font-size:12px;color:#9CD3F5;background:rgba(34,211,238,.07);padding:1px 6px;border-radius:4px}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px}
.page-head h2{font-size:19px;font-weight:600;letter-spacing:.3px}
.page-head p{font-size:12.5px;color:var(--txt3);margin-bottom:2px}
.page-head .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--txt3);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid rgba(148,163,184,.07);color:var(--txt2);vertical-align:middle}
.tbl tr:hover td{background:rgba(148,163,184,.045)}
.tbl td.t-main{color:var(--txt)}
.empty{padding:44px;text-align:center;color:var(--txt3);font-size:13px}
.subtabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line);flex:none;background:rgba(10,15,28,.35)}
.subtab{padding:11px 16px;cursor:pointer;color:var(--txt3);font-size:13px;transition:.15s;border-bottom:2px solid transparent}
.subtab:hover{color:var(--txt)}
.subtab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.subtab .sp{flex:1}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--cyan),transparent)}
.stat-card .k{font-size:11.5px;color:var(--txt3)}
.stat-card .v{font-size:25px;font-weight:600;margin-top:5px;font-family:var(--mono)}
.stat-card .v small{font-size:12px;color:var(--txt3);font-weight:400;margin-left:4px}

.list-tools{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.list-tools input,.list-tools select{background:rgba(148,163,184,.08);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--txt);font-size:13px;outline:none;font-family:inherit}
.onto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.onto-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.onto-card:hover{border-color:rgba(34,211,238,.4);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.onto-card .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;margin-bottom:12px}
.onto-card h3{font-size:15px;font-weight:600;margin-bottom:4px}
.onto-card .desc{font-size:12px;color:var(--txt3);line-height:1.6;min-height:36px;margin-bottom:12px}
.onto-meta{display:flex;gap:12px;font-size:11.5px;color:var(--txt3);border-top:1px solid var(--line);padding-top:11px;flex-wrap:wrap}
.onto-meta b{color:var(--txt2);font-weight:500}
.onto-card .acts{position:absolute;top:14px;right:14px;display:flex;gap:6px;opacity:0;transition:.2s}
.onto-card:hover .acts{opacity:1}
.onto-new{border:1.5px dashed rgba(148,163,184,.3);background:rgba(15,23,42,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--txt3);min-height:210px}
.onto-new:hover{border-color:var(--cyan);color:var(--cyan)}
.onto-new .plus{width:42px;height:42px;border-radius:50%;border:1.5px dashed currentColor;display:flex;align-items:center;justify-content:center;font-size:22px}

.mask{position:fixed;inset:0;background:rgba(3,7,15,.72);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{width:640px;max-width:94vw;max-height:88vh;overflow:auto;background:#0D1526;border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-head{display:flex;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0D1526;z-index:2}
.modal-head h3{font-size:15.5px;font-weight:600}
.msub{font-size:12px;color:var(--txt3);margin-left:12px}
.modal-head .sp{flex:1}
.modal-close{cursor:pointer;color:var(--txt3);font-size:19px;line-height:1;padding:4px}
.modal-close:hover{color:var(--txt)}
.modal-body{padding:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#0D1526}
.method-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.method-card{border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.2s;background:rgba(148,163,184,.03)}
.method-card:hover{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.05);transform:translateY(-2px)}
.method-card .mi{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:16px}
.method-card h4{font-size:13.5px;font-weight:600;margin-bottom:5px}
.method-card p{font-size:11.5px;color:var(--txt3);line-height:1.6}
.frm label{display:block;font-size:12px;color:var(--txt2);margin:13px 0 6px}
.frm label b{color:var(--cyan);font-weight:400}
.frm input,.frm select,.frm textarea{width:100%;background:rgba(148,163,184,.07);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:13px;outline:none;font-family:inherit;transition:.15s}
.frm input:focus,.frm select:focus,.frm textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.frm textarea{resize:vertical;min-height:84px;line-height:1.6}
.frm-row{display:flex;gap:14px}.frm-row>div{flex:1}
.dropzone{border:1.5px dashed rgba(148,163,184,.35);border-radius:12px;padding:32px;text-align:center;color:var(--txt3);cursor:pointer;transition:.2s}
.dropzone:hover{border-color:var(--cyan);color:var(--cyan)}
.cand-item{display:flex;align-items:flex-start;gap:11px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;transition:.15s}
.cand-item:hover{border-color:var(--line2)}
.cand-item.on{border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)}
.cand-item input[type=checkbox]{margin-top:3px;accent-color:#22D3EE}
.cand-item h5{font-size:13px;font-weight:600}
.cand-item p{font-size:11.5px;color:var(--txt3);margin-top:3px;line-height:1.55}
.stepbar{display:flex;gap:8px;margin-bottom:18px}
.step{flex:1;text-align:center;font-size:11.5px;color:var(--txt3);padding:8px 4px;border-radius:8px;border:1px solid var(--line)}
.step.on{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.07)}
.step.done{color:var(--green);border-color:rgba(52,211,153,.3)}
.prog{height:6px;border-radius:4px;background:rgba(148,163,184,.12);overflow:hidden;margin:14px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0891B2,#22D3EE);transition:width .4s;box-shadow:0 0 10px rgba(34,211,238,.6)}
.warnbox{font-size:12px;color:var(--txt2);margin-top:14px;background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:9px 12px;line-height:1.7}
.okbox{font-size:12px;color:var(--green);margin-top:14px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.25);border-radius:8px;padding:9px 12px;line-height:1.7}
.model-banner{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--txt2);background:rgba(129,140,248,.08);border:1px solid rgba(129,140,248,.3);border-radius:10px;padding:10px 14px;margin-bottom:16px;line-height:1.6}
.model-banner b{color:var(--purple);font-weight:600}
.ck-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:18px;border:1px solid var(--line);font-size:12.5px;color:var(--txt2);cursor:pointer;margin:0 7px 7px 0;transition:.15s;user-select:none}
.ck-chip:hover{border-color:var(--line2);color:var(--txt)}
.ck-chip.on{color:#fff;border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.12)}
.ck-chip input{accent-color:#22D3EE}

.tree-panel{width:268px;flex:none;display:flex;flex-direction:column;overflow:hidden}
.tp-head{padding:13px 14px 10px;border-bottom:1px solid var(--line)}
.tp-head .row{display:flex;align-items:center;gap:8px}
.tp-head select{flex:1;background:rgba(148,163,184,.08);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--txt);font-size:12.5px;outline:none;min-width:0}
.tp-tools{display:flex;gap:8px;margin-top:10px}
.tree{flex:1;overflow:auto;padding:10px 10px 20px}
.tree-cls-head{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--txt2);font-size:13px;transition:.15s}
.tree-cls-head:hover{background:rgba(148,163,184,.07);color:var(--txt)}
.tree-cls-head .cd{width:9px;height:9px;border-radius:3px;flex:none}
.tree-cls-head .cnt{margin-left:auto;font-size:11px;color:var(--txt3)}
.tree-cls-head .cact{display:none;gap:4px}
.tree-cls-head:hover .cact{display:flex}
.cact span{font-size:11px;color:var(--txt3);padding:1px 5px;border-radius:5px}
.cact span:hover{color:var(--cyan);background:rgba(34,211,238,.1)}
.tree-ent{display:flex;align-items:center;gap:8px;padding:7px 9px 7px 28px;border-radius:8px;cursor:pointer;color:var(--txt2);font-size:12.5px;transition:.15s}
.tree-ent:hover{background:rgba(148,163,184,.07);color:var(--txt)}
.tree-ent.sel{background:linear-gradient(90deg,rgba(34,211,238,.14),transparent);color:#fff;box-shadow:inset 2px 0 0 var(--cyan)}
.tree-ent .src{margin-left:auto;font-size:10px;color:var(--txt3);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none}
.model-main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;gap:14px}
.ent-head{padding:16px 20px}
.ent-head .row1{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.ent-head h3{font-size:17px;font-weight:600}
.ent-head .row2{margin-top:11px;font-size:12px;color:var(--txt3);line-height:1.7}
.ent-head .row2 b{color:var(--txt2);font-weight:500}
.tabs{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--txt3);font-size:12.5px;transition:.15s;border-bottom:2px solid transparent}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan);background:linear-gradient(180deg,rgba(34,211,238,.08),transparent)}
.tabs .sp{flex:1}
.tab-body{padding:16px 20px;overflow:auto;flex:1}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
.mini-stat{background:rgba(148,163,184,.05);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.mini-stat .k{font-size:11px;color:var(--txt3)}
.mini-stat .v{font-size:18px;font-weight:600;margin-top:3px}
.covbar{height:7px;border-radius:4px;background:rgba(148,163,184,.14);overflow:hidden;flex:1;min-width:90px}
.covbar i{display:block;height:100%;background:linear-gradient(90deg,#0891B2,#34D399);box-shadow:0 0 8px rgba(52,211,153,.5)}
.conv-box{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:13px;background:rgba(148,163,184,.03)}
.conv-box h4{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.req-fields{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.req-field{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);font-size:12px;color:var(--txt2);cursor:pointer;transition:.15s}
.req-field.on{border-color:rgba(34,211,238,.5);color:var(--cyan);background:rgba(34,211,238,.07)}
.req-field input{accent-color:#22D3EE}
.chg-item{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(148,163,184,.07);font-size:12.5px}
.chg-item .t{color:var(--txt3);flex:none;font-family:var(--mono);font-size:11.5px}
.ref-jump{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:rgba(148,163,184,.03)}
.stage-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:rgba(148,163,184,.03);flex-wrap:wrap}
.stage-row .sn{width:150px;font-size:13.5px;font-weight:600}
.stage-row .sn small{display:block;font-size:11px;color:var(--txt3);font-weight:400;margin-top:2px}
.stage-row select{background:rgba(148,163,184,.07);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:12.5px;outline:none;flex:1;min-width:150px}
.arrow-link{color:var(--txt3);font-size:16px}
.mtx{width:100%;border-collapse:collapse;font-size:12.5px}
.mtx th,.mtx td{padding:10px 12px;border:1px solid var(--line);text-align:center;color:var(--txt2)}
.mtx th{color:var(--txt);font-weight:600;background:rgba(148,163,184,.05)}
.mtx td:first-child{text-align:left;color:var(--txt)}

.g-overview{width:250px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:16px}
.g-canvas{flex:1;min-width:0;position:relative;background:radial-gradient(ellipse 70% 60% at 50% 45%, rgba(34,211,238,.045), transparent 70%)}
.g-detail{width:320px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:16px}
.g-sec{font-size:11.5px;color:var(--txt3);letter-spacing:1px;margin:16px 0 9px;font-weight:600}
.g-sec:first-child{margin-top:0}
.g-stat{display:flex;gap:10px;margin-bottom:6px}
.g-stat>div{flex:1;background:rgba(148,163,184,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.g-stat .n{font-size:21px;font-weight:600;font-family:var(--mono)}
.g-stat .l{font-size:11px;color:var(--txt3);margin-top:2px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:16px;border:1px solid var(--line);font-size:12px;color:var(--txt2);cursor:pointer;margin:0 6px 7px 0;transition:.15s;user-select:none}
.fchip:hover{border-color:var(--line2);color:var(--txt)}
.fchip.on{color:#fff;border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.1)}
.fchip .fd{width:8px;height:8px;border-radius:2.5px}
.hop-row{display:flex;gap:6px}

var modalStack=[];
function openModal(html,w){
  var m=document.createElement('div');m.className='mask';

}

function curEnt(){return curOnt().entities[state.selEnt];}

function clsOf(id){var cs=curOnt().classes;for(var i=0;i<cs.length;i++)if(cs[i].id===id)return cs[i];return null;}
function entIds(){return Object.keys(curOnt().entities);}
function logChange(txt){var o=curOnt();o.changes.unshift({t:now(),u:'张白辉',txt:txt});if(o.changes.length>50)o.changes.pop();o.updatedAt=now();}
function logEnt(e,txt){e.changes.unshift({t:now(),u:'张白辉',txt:txt});if(e.changes.length>30)e.changes.pop();}
function covOf(e){var m=e.props.filter(function(p){return p.mapped&&p.mapped!=='—'}).length;return {m:m,t:e.props.length,pct:e.props.length?Math.round(m/e.props.length*100):0};}
function relsOf(id){return curOnt().relations.filter(function(r){return r.from===id||r.to===id});}
function identMap(e){for(var i=0;i<e.maps.length;i++)if(e.maps[i].identity)return e.maps[i];return null;}
function actsOf(id){return curOnt().actions.filter(function(a){return a.targets.indexOf(id)>=0});}
function axiomsOf(id){return curOnt().axioms.filter(function(x){return x.bindings.some(function(b){return b.ent===id})});}
function axCheck(ax){var o=curOnt();var ok=0,bad=[];ax.bindings.forEach(function(b){var e=o.entities[b.ent];if(!e){bad.push(b.ent+':实体不存在');return;}
  var miss=b.req.filter(function(r){return !e.props.some(function(p){return p.code===r})});
  if(miss.length)bad.push(e.name+'：缺 '+miss.join('、'));else ok++;});
  return {ok:ok,bad:bad,total:ax.bindings.length};}

function drawTree(o){
  var html='';
  if(!o.classes.length)return '<div class="empty" style="padding:24px 10px">尚无类</div>';
  o.classes.forEach(function(c){
    var ents=Object.keys(o.entities).filter(function(k){return o.entities[k].cls===c.id});
    var subs=o.classes.filter(function(x){return x.parent===c.id});
    html+='<div class="tree-cls">';
    html+='<div class="tree-cls-head" data-cls="'+c.id+'">'
      +'<span class="cd" style="background:'+c.color+';box-shadow:0 0 6px '+c.color+'"></span>'
      +'<span>'+c.name+'</span><span class="cnt">'+ents.length+' 实体</span>'
      +(canEdit()?'<span class="cact"><span onclick="event.stopPropagation();mClass(\''+c.id+'\')" title="编辑类">✎</span><span onclick="event.stopPropagation();delClass(\''+c.id+'\')" title="删除类">✕</span></span>':'')
      +'</div>';
    html+='<div class="cls-children">';
    ents.forEach(function(id){
      var en=o.entities[id];
      html+='<div class="tree-ent'+(id===state.selEnt?' sel':'')+'" data-ent="'+id+'">'+en.name+'<span class="src">'+(SRC_LABEL[en.src]||en.src)+'</span></div>';
    });
    subs.forEach(function(sc){
      var sents=Object.keys(o.entities).filter(function(k){return o.entities[k].cls===sc.id});
      html+='<div style="padding-left:16px">'
        +'<div class="tree-cls-head"><span class="cd" style="background:'+sc.color+'"></span><span>'+sc.name+'</span><span class="cnt">'+sents.length+'</span></div>'
        +sents.map(function(id){var en=o.entities[id];return '<div class="tree-ent'+(id===state.selEnt?' sel':'')+'" data-ent="'+id+'" style="padding-left:44px">'+en.name+'<span class="src">'+(SRC_LABEL[en.src]||en.src)+'</span></div>'}).join('')
        +'</div>';
    });
    html+='</div></div>';
  });
  return html;
}

function bindCkChips(){

function doAction(aid){
  var o=curOnt();
  var name=$('#ac-name').value.trim();
  if(!name)return toast('请填写动作名称','err');
  if(!$('#ac-desc').value.trim())return toast('请填写业务描述','err');
  var targets=$$('#ac-targets input:checked').map(function(cb){return cb.getAttribute('data-t')});
  if(!targets.length)return toast('请至少绑定一个对象','err');
  if(aid){
    var a=o.actions.find(function(x){return x.id===aid});
    a.name=name;a.tgt=$('#ac-tgt').value;a.targets=targets;a.input=$('#ac-in').value.trim()||'—';a.output=$('#ac-out').value.trim()||'—';a.desc=$('#ac-desc').value.trim();a.status=$('#ac-st').value;
    logChange('修改动作「'+name+'」（绑定 '+targets.length+' 个对象）');
  }else{
    var code=$('#ac-code').value.trim()||('act_'+Math.random().toString(36).slice(2,6));
    if(o.actions.some(function(x){return x.code===code}))return toast('动作标识已存在','err');
    o.actions.push({id:uid('a'),name:name,code:code,tgt:$('#ac-tgt').value,targets:targets,input:$('#ac-in').value.trim()||'—',output:$('#ac-out').value.trim()||'—',desc:$('#ac-desc').value.trim(),status:$('#ac-st').value});
    logChange('新建动作「'+name+'」（绑定 '+targets.length+' 个对象）');
  }
  closeModal();renderActions();toast('动作已保存','ok');
}
function delAction(aid){
  var o=curOnt();
  var a=o.actions.find(function(x){return x.id===aid});

    o.actions=o.actions.filter(function(x){return x.id!==aid});
    logChange('删除动作「'+a.name+'」');
    renderActions();toast('动作已删除','ok');
  },true);
}

var _axEnts={};
var _axPick={};

    +'<div id="ax-binds"></div>'

function axToggle(id){
  var o=curOnt();
  _axEnts[id]=!_axEnts[id];
  $$('#ax-ents .ck-chip').forEach(function(el){
    if(el.textContent===o.entities[id].name)el.classList.toggle('on',_axEnts[id]);
  });
  drawAxBinds();
}
function drawAxBinds(){
  var o=curOnt();
  var box=$('#ax-binds');if(!box)return;
  $$('[data-ax]').forEach(function(cb){
    var ent=cb.getAttribute('data-ax'),p=cb.getAttribute('data-p');
    if(!_axPick[ent])_axPick[ent]={};
    _axPick[ent][p]=cb.checked;
  });
  var html='';
  Object.keys(_axEnts).forEach(function(id){
    if(!_axEnts[id])return;
    var e=o.entities[id];if(!e)return;
    var pre=null;
    if(_axEdit)_axEdit.bindings.forEach(function(b){if(b.ent===id)pre=b});
    html+='<div class="conv-box"><h4>'+e.name+' · 必含字段 <span class="tag info">'+(clsOf(e.cls)?clsOf(e.cls).name:'')+'</span></h4><div class="req-fields">'
      +e.props.map(function(p){
        var on;
        if(_axPick[id]&&_axPick[id][p.code]!==undefined)on=_axPick[id][p.code];
        else on=!!(pre&&pre.req.indexOf(p.code)>=0);
        return '<label class="req-field'+(on?' on':'')+'"><input type="checkbox" '+(on?'checked':'')+' data-ax="'+id+'" data-p="'+p.code+'" onchange="this.parentElement.classList.toggle(\'on\',this.checked)">'+p.name+(p.rule&&p.rule!=='—'?' <span style="font-size:10px;color:var(--txt3)">· '+p.rule+'</span>':'')+'</label>';
      }).join('')
      +'</div>'+(e.props.length?'':'<div style="font-size:12px;color:var(--txt3);margin-top:8px">该实体暂无属性</div>')+'</div>';
  });
  box.innerHTML=html||'<div style="font-size:12px;color:var(--txt3)">请先选择适用实体</div>';
}
function doAxiom(xid){
  var o=curOnt();
  var name=$('#x-name').value.trim();
  if(!name)return toast('请填写公理名称','err');
  if(!$('#x-desc').value.trim())return toast('请填写语义描述','err');
  var ents=Object.keys(_axEnts).filter(function(k){return _axEnts[k]});
  if(!ents.length)return toast('请至少绑定一个实体','err');
  var bindings=[];
  var emptyEnt=[];
  ents.forEach(function(id){
    var req=$$('[data-ax="'+id+'"]:checked').map(function(cb){return cb.getAttribute('data-p')});
    if(!req.length)emptyEnt.push(o.entities[id].name);
    bindings.push({ent:id,req:req});
  });
  if(emptyEnt.length)return toast('以下实体未勾选必含字段：'+emptyEnt.join('、'),'err');
  if(xid){
    var x=o.axioms.find(function(y){return y.id===xid});
    x.name=name;x.type=$('#x-type').value;x.desc=$('#x-desc').value.trim();x.bindings=bindings;
    logChange('修改公理「'+name+'」（绑定 '+bindings.length+' 个实体）');
  }else{
    var code=$('#x-code').value.trim()||('ax_'+Math.random().toString(36).slice(2,6));
    if(o.axioms.some(function(y){return y.code===code}))return toast('公理标识已存在','err');
    o.axioms.push({id:uid('x'),name:name,code:code,type:$('#x-type').value,desc:$('#x-desc').value.trim(),bindings:bindings});
    logChange('新建公理「'+name+'」（绑定 '+bindings.length+' 个实体）');
  }
  closeModal();renderAxioms();toast('公理已保存并完成自检','ok');
}
function delAxiom(xid){
  var o=curOnt();
  var x=o.axioms.find(function(y){return y.id===xid});
  confirmBox('删除公理「'+x.name+'」','⚠️ 将解除 <b style="color:var(--amber)">'+x.bindings.length+'</b> 个实体的公理绑定。',function(){
    o.axioms=o.axioms.filter(function(y){return y.id!==xid});
    logChange('删除公理「'+x.name+'」');
    renderAxioms();toast('公理已删除','ok');
  },true);
}

function wz2Finish(){
  var o=curOnt();

  var newEnts=0,newProps=0,newMaps=0,newRels=0;
  wz2.tables.forEach(function(t){
    if(!t.use)return;
    var eid=t.target;
    if(eid==='__new'){
      var cls=o.classes.find(function(c){return c.name===t.clsName});
      if(!cls){cls={id:uid('c'),name:t.clsName,code:'cls_'+o.classes.length,color:t.color,parent:null};o.classes.push(cls);}
      eid=uid('e');

      newEnts++;
    }
    var e=o.entities[eid];
    e.maps=e.maps.filter(function(m){return m.table!==t.table});
    t.cols.forEach(function(c,j){
      var pid=t.binds[j];
      if(pid==='__new'){
        pid='p'+e.props.length+'_'+j;
        e.props.push(P(c.cm,pid,c.etype,{req:!!(c.rule),uni:!!(c.rule),rule:c.rule||'—'}));
        newProps++;
      }
      e.maps.push({prop:pid,src:srcName,table:t.table,col:c.col,srctype:c.type,identity:wz2.ident[t.table]===c.col});
      var prop=e.props.find(function(p){return p.code===pid});

function visibleSet(){
  var o=curOnt();

  var sel=state.graph.sel;
  if(sel&&sel.type==='node'&&o.entities[sel.id]){
    if(!ids.has(sel.id))return new Set();
    var dist={};dist[sel.id]=0;var q=[sel.id];
    while(q.length){
      var cur=q.shift();
      if(dist[cur]>=state.graph.hops)continue;
      o.relations.forEach(function(r){
        var nxt=r.from===cur?r.to:(r.to===cur?r.from:null);
        if(nxt&&o.entities[nxt]&&dist[nxt]===undefined){dist[nxt]=dist[cur]+1;q.push(nxt);}
      });
    }
    var ids2=new Set();
    Object.keys(dist).forEach(function(id){if(ids.has(id))ids2.add(id)});
    ids=ids2;
  }
  return ids;

function initGraphIfNeeded(force){
  if(!gsvg)return;

  if(gFirst||force){
    var ks=Object.keys(o.entities);
    ks.forEach(function(k,i){
      var a=i/Math.max(ks.length,1)*Math.PI*2;
      o.entities[k].x=r.width/2+Math.cos(a)*Math.min(240,r.width*.3);
      o.entities[k].y=r.height/2+Math.sin(a)*Math.min(160,r.height*.3);
      o.entities[k].vx=0;o.entities[k].vy=0;o.entities[k]._drag=null;

  gRO=new ResizeObserver(function(){

function restartSim(){if(simRunning)return;simRunning=true;requestAnimationFrame(step);}
function step(){
  if(!gvp){simRunning=false;return;}
  var W=gsvg.viewBox.baseVal.width||900,H=gsvg.viewBox.baseVal.height||600;
  var nodes=[];gvp.querySelectorAll('.gnode').forEach(function(g){if(g._ent)nodes.push(g._ent)});
  var i,j;
  for(i=0;i<nodes.length;i++)for(j=i+1;j<nodes.length;j++){
    var a=nodes[i],b=nodes[j];
    var dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
    if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1;}
    var d=Math.sqrt(d2),f=2600/d2,fx=dx/d*f,fy=dy/d*f;
    a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
  }
  var o=curOnt();
  o.relations.forEach(function(r){
    var a=o.entities[r.from],b=o.entities[r.to];
    if(!a||!b)return;
    if(!gvp.querySelector('.gnode[data-id="'+r.from+'"]')||!gvp.querySelector('.gnode[data-id="'+r.to+'"]'))return;
    var dx=b.x-a.x,dy=b.y-a.y;var d=Math.sqrt(dx*dx+dy*dy)||1;
    var f=(d-130)*.015,fx=dx/d*f,fy=dy/d*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  });
  nodes.forEach(function(n){
    n.vx+=((W/2)-n.x)*.0025;n.vy+=((H/2)-n.y)*.0025;
    if(n._drag){n.x=n._drag.x;n.y=n._drag.y;n.vx=0;n.vy=0;return;}
    n.vx*=.86;n.vy*=.86;
    n.x=Math.max(46,Math.min(W-46,n.x+n.vx));
    n.y=Math.max(46,Math.min(H-46,n.y+n.vy));
  });
  updateGraphDOM();
  var moving=nodes.some(function(n){return Math.abs(n.vx)+Math.abs(n.vy)>.35});
  if(moving)requestAnimationFrame(step);else{simRunning=false;updateGraphDOM();}
}
function neighbors(){
  var sel=state.graph.sel;
  if(!sel||sel.type!=='node')return null;
  var o=curOnt();
  var s=new Set([sel.id]);
  o.relations.forEach(function(r){if(r.from===sel.id)s.add(r.to);if(r.to===sel.id)s.add(r.from)});
  return s;
}
function updateGraphDOM(){
  if(!gvp)return;

  gvp.querySelectorAll('.gnode').forEach(function(g){
    var e=g._ent;if(!e)return;
    g.setAttribute('transform','translate('+e.x+','+e.y+')');
    var t=g.querySelector('text');if(t)t.setAttribute('y',38);
    var sel=state.graph.sel&&state.graph.sel.type==='node'&&state.graph.sel.id===g._id;
    var dim=nb&&!sel&&!nb.has(g._id);
    g.classList.toggle('sel',!!sel);g.classList.toggle('dim',!!dim);
  });
  gvp.querySelectorAll('g').forEach(function(eg){
    var r=eg._rel;if(!r)return;
    var a=curOnt().entities[r.from],b=curOnt().entities[r.to];
    if(!a||!b)return;
    var sel=state.graph.sel&&state.graph.sel.type==='edge'&&state.graph.sel.id===r.id;
    eg.querySelectorAll('line').forEach(function(l){l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y)});
    var ln=eg.querySelector('.edge-path');
    ln.setAttribute('stroke',sel?'#22D3EE':'#3E4B63');ln.setAttribute('stroke-width',sel?2.2:1.3);
    var lb=eg.querySelector('text');
    lb.setAttribute('x',(a.x+b.x)/2);lb.setAttribute('y',(a.y+b.y)/2-6);lb.setAttribute('text-anchor','middle');
    lb.setAttribute('fill',sel?'#22D3EE':'#64748B');
  });
}
function selectNode(id){state.graph.sel={type:'node',id:id};refreshGraph();renderDetail();}
function applyView(){if(gvp)gvp.setAttribute('transform','translate('+view.x+','+view.y+') scale('+view.k+')');}
function zoomAt(px,py,f){
  var k1=view.k,k2=Math.max(.3,Math.min(3,k1*f));
  view.x=px-(px-view.x)*k2/k1;view.y=py-(py-view.y)*k2/k1;view.k=k2;applyView();
}
function bindGraphEvents(){
  var pan=null,dragN=null,moved=0;
  gsvg.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=gsvg.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.1:0.9);
  },{passive:false});
  gsvg.addEventListener('pointerdown',function(e){
    var g=e.target.closest?e.target.closest('.gnode'):null;
    moved=0;
    if(g){
      dragN=g._ent;
      dragN._drag=graphPt(svgPt(e));
      gsvg.setPointerCapture(e.pointerId);
    }else{
      pan={x:e.clientX-view.x,y:e.clientY-view.y};
      gsvg.classList.add('panning');
      gsvg.setPointerCapture(e.pointerId);
    }
  });
  gsvg.addEventListener('pointermove',function(e){
    moved+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0);
    if(dragN){dragN._drag=graphPt(svgPt(e));restartSim();}
    else if(pan){view.x=e.clientX-pan.x;view.y=e.clientY-pan.y;applyView();}
  });
  gsvg.addEventListener('pointerup',function(e){
    if(dragN){
      if(moved<5){
        var id=null;var o=curOnt();
        Object.keys(o.entities).forEach(function(k){if(o.entities[k]===dragN)id=k});
        if(id)selectNode(id);
      }
      dragN._drag=null;dragN=null;restartSim();
    }else if(pan&&moved<4){
      state.graph.sel=null;refreshGraph();renderDetail();
    }
    pan=null;if(gsvg)gsvg.classList.remove('panning');
  });
  gsvg.addEventListener('dblclick',function(e){
    var g=e.target.closest?e.target.closest('.gnode'):null;
    if(!g)return;
    var id=null;var o=curOnt();
    Object.keys(o.entities).forEach(function(k){if(o.entities[k]===g._ent)id=k});
    if(!id)return;
    state.graph.sel={type:'node',id:id};
    if(state.graph.hops<2){state.graph.hops=2;$$('.hop-btn').forEach(function(b){b.classList.toggle('on',b.textContent==='2')});}
    refreshGraph();renderDetail();
  });
  gsvg.addEventListener('contextmenu',function(e){
    var g=e.target.closest?e.target.closest('.gnode'):null;
    if(!g)return;
    e.preventDefault();
    var id=null;var o=curOnt();
    Object.keys(o.entities).forEach(function(k){if(o.entities[k]===g._ent)id=k});
    if(!id)return;
    var ctx=$('#gctx');
    ctx.style.display='block';
    ctx.style.left=Math.min(e.clientX,window.innerWidth-200)+'px';
    ctx.style.top=Math.min(e.clientY,window.innerHeight-170)+'px';
    ctx.innerHTML=''
      +'<div onclick="gctxAct(\'expand\',\''+id+'\')">以此为起点展开（2 跳）</div>'
      +'<div onclick="gctxAct(\'collapse\',\''+id+'\')">收起至 1 跳</div>'
      +'<div onclick="gctxAct(\'open\',\''+id+'\')">在本体框架管理中打开</div>'
      +'<div onclick="gctxAct(\'copy\',\''+id+'\')">复制实体标识</div>';
  });
  document.addEventListener('click',function(){var c=$('#gctx');if(c)c.style.display='none';});
}
function gctxAct(act,id){
  var c=$('#gctx');if(c)c.style.display='none';
  if(act==='expand'){state.graph.sel={type:'node',id:id};state.graph.hops=2;$$('.hop-btn').forEach(function(b){b.classList.toggle('on',b.textContent==='2')});refreshGraph();renderDetail();}
  if(act==='collapse'){state.graph.sel={type:'node',id:id};state.graph.hops=1;$$('.hop-btn').forEach(function(b){b.classList.toggle('on',b.textContent==='1')});refreshGraph();renderDetail();}
  if(act==='open'){state.selEnt=id;state.tab='overview';switchPage('model');}
  if(act==='copy'){
    var e=curOnt().entities[id];
    if(e&&navigator.clipboard)navigator.clipboard.writeText(e.code).then(function(){toast('已复制标识 <code>'+e.code+'</code>','ok')});
  }
}
function svgPt(e){var r=gsvg.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function graphPt(p){return {x:(p.x-view.x)/view.k,y:(p.y-view.y)/view.k};}
function renderDetail(){
  var d=$('#g-detail');if(!d)return;
  var o=curOnt();
  var sel=state.graph.sel;
  var html='';
  if(!sel){
    html+='<div class="g-sec">本体概览</div>';
    html+='<div class="d-node"><h4>'+o.name+' <span class="tag '+(o.status==='published'?'ok':'warn')+'">'+(o.status==='published'?'已发布 v'+o.version:'草稿')+'</span></h4>'
      +'<div class="d-kv"><span>类</span><b>'+o.classes.length+' 个</b></div>'
      +'<div class="d-kv"><span>实体</span><b>'+Object.keys(o.entities).length+' 个</b></div>'
      +'<div class="d-kv"><span>关系</span><b>'+o.relations.length+' 条</b></div>'
      +'<div class="d-kv"><span>动作 / 公理</span><b>'+o.actions.length+' / '+o.axioms.length+'</b></div></div>';
    html+='<div class="g-sec">类结构（默认视图）</div>';
    o.classes.forEach(function(c){
      var ents=Object.keys(o.entities).filter(function(k){return o.entities[k].cls===c.id});
      html+='<div class="d-node"><h4><span style="width:9px;height:9px;border-radius:3px;background:'+c.color+';display:inline-block"></span>'+c.name+'</h4>'
        +'<div class="d-list">'+(ents.map(function(k){return '· '+o.entities[k].name+' <code>'+o.entities[k].code+'</code>'}).join('<br>')||'<span style="color:var(--txt3)">（空）</span>')+'</div></div>';
    });
    if(o.axioms.length){
      html+='<div class="g-sec">公理汇总</div>';
      o.axioms.forEach(function(x){
        var s=axCheck(x);
        html+='<div class="d-node"><h4>'+x.name+' '+(s.bad.length?'<span class="tag warn">⚠️ '+s.ok+'/'+s.total+'</span>':'<span class="tag ok">✅ '+s.total+'/'+s.total+'</span>')+'</h4>'
          +'<div style="font-size:11.5px;color:var(--txt3);line-height:1.6">'+x.desc+'</div></div>';
      });
    }
    html+='<div class="g-sec">操作提示</div><div style="font-size:12px;color:var(--txt3);line-height:1.8">单击节点查看详情；切换跳数查看邻域子图；右键节点更多操作。</div>';
  }else if(sel.type==='node'){
    var e=o.entities[sel.id];
    if(!e){state.graph.sel=null;return renderDetail();}
    var c=clsOf(e.cls),cov=covOf(e),rs=relsOf(sel.id),axs=axiomsOf(sel.id),acts=actsOf(sel.id),idm=identMap(e);
    html+='<div class="g-sec">节点信息</div>';
    html+='<div class="d-node"><h4>'+e.name+'<span class="chip c-on" style="margin-left:6px"><span style="width:7px;height:7px;border-radius:2px;background:'+(c?c.color:'#888')+'"></span>'+(c?c.name:'未分类')+'</span></h4>'
      +'<div class="d-kv"><span>标识</span><b><code>'+e.code+'</code></b></div>'
      +'<div class="d-kv"><span>来源</span><b>'+(SRC_LABEL[e.src]||e.src)+'</b></div>'
      +'<div class="d-kv"><span>映射覆盖率</span><b>'+cov.m+'/'+cov.t+'（'+cov.pct+'%）</b></div>'
      +'<div class="d-kv"><span>对象身份</span><b>'+(idm?idm.col:'未设置')+'</b></div>'
      +'<div class="d-kv"><span>描述</span><b>'+e.desc+'</b></div></div>';
    html+='<div class="g-sec">节点属性</div>';
    html+='<div class="d-node"><div class="d-list">'+(e.props.map(function(p){return p.name+' <span style="color:var(--txt3)">· '+p.type+(p.req?' · 必填':'')+(p.mapped?' · 已映射':'')+'</span>'}).join('<br>')||'<span style="color:var(--txt3)">无属性</span>')+'</div></div>';
    html+='<div class="g-sec">关系（'+rs.length+'）</div>';
    html+='<div class="d-node"><div class="d-list">'+(rs.map(function(r){
      var out=r.from===sel.id;var other=o.entities[out?r.to:r.from];
      if(!other)return '';
      return (out?'<span style="color:var(--cyan)">→</span>':'<span style="color:var(--green)">←</span>')+' '+other.name+' <span style="color:var(--txt3)">（'+r.name+' · '+r.card+'）</span>';
    }).join('<br>')||'<span style="color:var(--txt3)">暂无</span>')+'</div></div>';
    if(axs.length){
      html+='<div class="g-sec">公理（引用）</div>';
      axs.forEach(function(x){
        var s=axCheck(x);
        html+='<div class="d-node" style="font-size:12px;color:var(--txt2);line-height:1.7"><b style="color:var(--txt)">'+x.name+'</b> '+(s.bad.length?'<span class="tag warn">⚠️</span>':'<span class="tag ok">✅</span>')+'<br>'+x.desc+'</div>';
      });
    }
    if(acts.length){
      html+='<div class="g-sec">动作（引用）</div>';
      html+='<div class="d-node"><div class="d-list">'+acts.map(function(a){return '· '+a.name+' <span style="color:var(--txt3)">（'+a.desc+'）</span>'}).join('<br>')+'</div></div>';
    }
  }else{
    var r=o.relations.find(function(x){return x.id===sel.id});
    if(!r){state.graph.sel=null;return renderDetail();}
    var a=o.entities[r.from],b=o.entities[r.to];
    html+='<div class="g-sec">关系信息</div>';
    var rActs=o.actions.filter(function(ac){return ac.tgt==='relation'&&ac.targets.indexOf(r.id)>=0});
    html+='<div class="d-node"><h4>'+a.name+' <span style="color:var(--cyan)">—'+r.name+'→</span> '+b.name+'</h4>'
      +'<div class="d-kv"><span>正向 / 反向</span><b>'+r.name+' / '+r.rev+'</b></div>'
      +'<div class="d-kv"><span>基数</span><b><code>'+r.card+'</code></b></div>'
      +'<div class="d-kv"><span>描述</span><b>'+(r.desc||'—')+'</b></div>'
      +(rActs.length?'<div class="d-kv"><span>绑定动作</span><b>'+rActs.map(function(ac){return ac.name}).join('、')+'</b></div>':'')+'</div>';
  }
  d.innerHTML=html;
}
